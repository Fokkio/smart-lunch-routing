<div class="app-shell" [class.rider-shell]="router.url.startsWith('/rider')">
  @if (!router.url.startsWith('/rider')) { <header class="topbar">
    <a class="brand" routerLink="/owner/dashboard" aria-label="ครัวเที่ยงตรง หน้าหลัก">
      <span class="brand-mark" aria-hidden="true">ก</span>
      <span class="brand-copy"><strong>ครัวเที่ยงตรง</strong><span>จัดส่งมื้อเที่ยง</span></span>
    </a>
    <span class="topbar-context">วันนี้ · ข้อมูลตัวอย่าง</span>
    <a class="rider-shortcut" routerLink="/rider">เปิดหน้าไรเดอร์</a>
  </header> }
  @if (!router.url.startsWith('/rider')) {
    <aside class="sidebar" aria-label="เมนูเจ้าของร้าน">
      <div class="sidebar-caption">งานของร้าน</div>
      <nav>
        <a routerLink="/owner/dashboard" routerLinkActive="active">หน้าหลัก</a>
        <a routerLink="/owner/customers" routerLinkActive="active">ลูกค้า</a>
        <a routerLink="/owner/orders" routerLinkActive="active">ออเดอร์</a>
        <a routerLink="/owner/delivery" routerLinkActive="active">จัดส่งวันนี้</a>
        <a routerLink="/owner/history" routerLinkActive="active">ประวัติการจัดส่ง</a>
      </nav>
      <div class="sidebar-bottom"><strong>รอบเที่ยง</strong><span>ออกส่ง 11:30 น.<br>ก่อน 12:30 น.</span></div>
    </aside>
  }
  <div class="main-slot"><router-outlet /></div>
</div>
